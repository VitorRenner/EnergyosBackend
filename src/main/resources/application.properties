spring.application.name=backend.energyos


spring.datasource.url=jdbc:postgresql://localhost:5432/energyos
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# informações sobre o banco de dados e API integrador
influx.token=${INFLUX_TOKEN}
influx.bucket=energyosDB

# microControlId usado no endpoint GET /api/telemetry/latest
# Troque para um UUID válido gravado no Influx (coluna microControlID).
telemetry.microControlId=00000000-0000-0000-0000-000000000000
